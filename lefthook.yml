commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    prettier:
      glob: '*.{ts,tsx,js,mjs,json,md,yml,yaml,css,html}'
      run: pnpm exec prettier --check {staged_files}
    rustfmt:
      glob: '*.rs'
      run: cargo fmt --all --check
