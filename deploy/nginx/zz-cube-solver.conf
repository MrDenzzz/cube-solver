# Static host for the web app at https://cube.mrdenzzz.ru.
#
# Install as /etc/nginx/sites-available/zz-cube-solver and link it from sites-enabled, with
# cube-solver-headers.conf in /etc/nginx/snippets/. The name sorts after the server's other sites
# on purpose: the first server listening on 443 is the default one, and this site must not take
# that over. No http2 on the listen lines: before nginx 1.25 it switches the whole port, other
# sites included.
#
# CI uploads the build into /var/www/cube.mrdenzzz.ru as the `deploy` user, whose key is
# restricted to rrsync in that directory (see docs/deploy.md).

# Plain HTTP: certbot's challenges, and a redirect for everything else.
server {
    listen 80;
    server_name cube.mrdenzzz.ru;
    access_log off;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name cube.mrdenzzz.ru;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/cube.mrdenzzz.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cube.mrdenzzz.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/cube.mrdenzzz.ru;
    index index.html;

    # The mime.types of nginx 1.18 has no .wasm entry, and WebAssembly.instantiateStreaming
    # rejects any Content-Type other than application/wasm. A types block replaces the inherited
    # map, so the standard one is included first.
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
    }

    # The build ships a .gz copy next to every compressible file.
    gzip_static on;
    gzip_vary on;

    # Vite gives everything under /assets/ a content hash in its name, so a name never changes
    # meaning and browsers may keep these files for good.
    location /assets/ {
        include snippets/cube-solver-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html and the other unhashed files are revalidated on every visit, so a deploy shows
    # up at once.
    location / {
        include snippets/cube-solver-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
