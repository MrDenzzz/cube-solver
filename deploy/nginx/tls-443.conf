# TCP 443 is shared by the sites and the VPN (the amnezia-xray container, published on
# 127.0.0.1:10443). Connections are routed by the server name in the TLS ClientHello without
# being decrypted: the sites' names go to nginx's HTTPS servers on 127.0.0.1:9443, everything
# else, the VPN's own name included, to xray unchanged. The sites therefore see every client as
# 127.0.0.1. Included from the main context of /etc/nginx/nginx.conf.
stream {
    map $ssl_preread_server_name $tls_backend {
        cube.mrdenzzz.ru      127.0.0.1:9443;
        forza.mrdenzzz.ru     127.0.0.1:9443;
        forza-api.mrdenzzz.ru 127.0.0.1:9443;
        default               127.0.0.1:10443;
    }

    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $tls_backend;
        proxy_connect_timeout 5s;
        # VPN connections can idle for long stretches.
        proxy_timeout 1h;
    }
}
