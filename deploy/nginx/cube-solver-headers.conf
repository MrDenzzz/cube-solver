# Included by every location in zz-cube-solver.conf: an add_header inside a location drops all
# add_header directives inherited from the server block, so the shared headers live here.

# Cross-origin isolation enables SharedArrayBuffer (the search cancellation flag) and
# performance.measureUserAgentSpecificMemory. Safari has no COEP credentialless, hence require-corp.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
