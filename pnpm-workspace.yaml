packages:
  - apps/*
  - packages/*
  - tools/*

catalog:
  '@commitlint/cli': ^21.2.3
  '@commitlint/config-conventional': ^21.2.3
  '@eslint/js': ^10.0.1
  '@react-three/fiber': ^9.8.1
  '@types/node': ^24.19.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@types/three': ^0.186.0
  '@vitejs/plugin-react': ^6.1.1
  binaryen: 132.0.0
  eslint: ^10.12.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-react-refresh: ^0.5.7
  fast-check: ^4.10.2
  globals: ^17.13.0
  lefthook: ^2.1.16
  prettier: ^3.9.9
  react: ^19.3.0
  react-dom: ^19.3.0
  three: ^0.186.1
  turbo: ^2.11.7
  # typescript-eslint 8.71 supports TypeScript <6.1; move to 7.x once it does.
  typescript: ~6.0.3
  typescript-eslint: ^8.71.0
  vite: ^8.3.2
  vitest: ^5.0.3

allowBuilds:
  # Its postinstall only installs git hooks; the root `prepare` script does that explicitly.
  lefthook: false
