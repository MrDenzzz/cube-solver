[workspace]
resolver = "3"
members = ["packages/solver-wasm/crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
cube = { path = "packages/solver-wasm/crates/cube" }
solver = { path = "packages/solver-wasm/crates/solver" }
# Must equal the wasm-bindgen CLI version exactly; scripts/build-wasm.ts enforces it.
wasm-bindgen = "=0.2.129"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "fat"
